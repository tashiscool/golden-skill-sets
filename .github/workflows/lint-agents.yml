name: Validate Golden Skill Sets

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'extended-agents/**'
      - 'evals/**'
      - 'evals/industries/**'
      - 'docs/golden/**'
      - 'scripts/**'
      - '.github/workflows/lint-agents.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'extended-agents/**'
      - 'evals/**'
      - 'evals/industries/**'
      - 'docs/golden/**'
      - 'scripts/**'
      - '.github/workflows/lint-agents.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate golden skills and extended agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run authoritative validation
        run: |
          chmod +x scripts/validate-golden.sh
          ./scripts/validate-golden.sh
