name: Lint Agent Files

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'extended-agents/**'
      - 'evals/**'
      - 'docs/golden/**'
      - 'scripts/**'

jobs:
  validate:
    name: Validate golden skills and extended agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run authoritative validation
        run: |
          chmod +x scripts/validate-golden.sh
          ./scripts/validate-golden.sh
