name: New Skill Or Agent Request
description: Suggest a new golden workflow skill or extended specialist agent
labels: ["enhancement", "new-agent"]
body:
  - type: input
    id: agent-name
    attributes:
      label: Skill or Agent Name
      placeholder: e.g. Migration Risk Reviewer
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - golden workflow skill
        - extended engineering agent
        - extended testing agent
        - extended product/project agent
        - extended domain/industry agent
        - engineering
        - design
        - marketing
        - product
        - project-management
        - testing
        - support
        - spatial-computing
        - specialized
        - strategy
        - new category (describe below)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What would this skill or agent do?
      placeholder: Describe its specialty, when you'd use it, and what gap it fills.
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Example use cases
      placeholder: Give 2-3 real scenarios where this agent would be useful.
    validations:
      required: false
